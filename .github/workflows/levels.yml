name: Swing levels

on:
  schedule:
    - cron: "*/30 12-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: levels
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run algo
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATAFIRST_API_KEY: ${{ secrets.DATAFIRST_API_KEY }}
          DATAFIRST_BASE_URL: ${{ vars.DATAFIRST_BASE_URL }}
        run: python run.py

      - name: Save picks log + page to this repo
        run: |
          git config user.name "levels-bot"
          git config user.email "levels-bot@users.noreply.github.com"
          git add state site
          git diff --cached --quiet || git commit -m "levels $(date -u +%F' '%H:%M)"
          git pull --rebase -q || true
          git push

      - name: Publish page to brief repo
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        if: env.PAGES_TOKEN != ''
        run: |
          git clone -q --depth 1 "https://x-access-token:${PAGES_TOKEN}@github.com/Wavy9s/sentiment2343.git" pub
          mkdir -p pub/levels
          cp site/index.html pub/levels/index.html
          cd pub
          git config user.name "levels-bot"
          git config user.email "levels-bot@users.noreply.github.com"
          git add levels
          git diff --cached --quiet || git commit -m "levels page $(date -u +%F' '%H:%M)"
          git push -q
