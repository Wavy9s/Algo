name: Swing levels

on:
  schedule:
    - cron: "*/30 12-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: levels
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run algo
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATAFIRST_API_KEY: ${{ secrets.DATAFIRST_API_KEY }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: python run.py

      - name: Save page + picks log
        run: |
          cp site/index.html index.html
          touch .nojekyll
          git config user.name "levels-bot"
          git config user.email "levels-bot@users.noreply.github.com"
          git add -A state site index.html .nojekyll
          git diff --cached --quiet || git commit -m "levels $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done

      - name: Rebuild page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
